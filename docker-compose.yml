# ContainedCode - Universal Coding Agent Container
# 
# Usage:
#   ./start.sh                   (agent in tmux + SSH access)
#   ./start.sh --web             (agent + web IDE server)
#   ./start.sh --shell           (Interactive shell)
#
# Connect via SSH:
#   ssh -p 2222 opencode@localhost         (then: tmux attach)
#   ssh -p 2222 opencode@your-server-ip    (from another machine)
#
# Connect via docker exec:
#   docker exec -it containedcode tmux attach

services:
  containedcode:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    image: containedcode:latest
    container_name: containedcode
    
    ports:
      - "${PORT:-8888}:${PORT:-8888}"
      - "${SSH_PORT:-2222}:2222"
    
    environment:
      - WEB_SERVER_PASSWORD=${WEB_SERVER_PASSWORD:-}
      - WEB_SERVER_ENABLED=${WEB_SERVER_ENABLED:-false}
      - PORT=${PORT:-8888}
      - HOSTNAME=0.0.0.0
      - AGENT_CMD=${AGENT_CMD:-}
      - AGENT_ARGS=${AGENT_ARGS:-}
      - PI_COMMAND=${PI_COMMAND:-}
      - PI_ARGS=${PI_ARGS:-}
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
    
    volumes:
      - ./workspace:/workspace:rw
      - ${WEB_CONFIG_DIR:-${OPENCODE_CONFIG_DIR:-~/.config/opencode}}:/home/opencode/.config/opencode:ro
      - ${AGENT_CONFIG_DIR:-${PI_CONFIG_DIR:-~/.pi}}:/home/opencode/.pi:rw
      - ${SSH_AUTHORIZED_KEYS:-~/.ssh/authorized_keys}:/home/opencode/.ssh/authorized_keys:ro
      - nix-store:/nix:rw
      - opencode-data:/home/opencode/.local:rw
      - opencode-cache:/home/opencode/.cache:rw
    
    security_opt:
      - no-new-privileges:true
    read_only: false
    
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd && (tmux has-session -t agent 2>/dev/null || true) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nix-store:
    name: containedcode-nix-store
  opencode-data:
    name: containedcode-data
  opencode-cache:
    name: containedcode-cache
